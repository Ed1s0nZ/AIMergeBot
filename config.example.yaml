# Copy automatically to config.yaml on first start. Configure in System Settings.
listen: ":8080"
public_url: "" # Set https://audit.example.com when TLS terminates at a reverse proxy
trusted_proxies: [] # Explicit proxy IP/CIDR only; empty ignores forwarded client-IP headers. Restart required.
gitlab:
  token: ""
  url: "https://gitlab.com"
openai:
  api_key: ""
  url: "https://api.openai.com/v1"
  model: "gpt-4o-mini"
projects: []
enable_polling: false
enable_webhook: false
enable_mr_comment: false
scan_existing_mrs: false
webhook_token: ""
audit_workers: 2
audit_timeout_seconds: 300
whitelist_extensions: [txt, md, xlsx, xls, csv, zip]
react:
  enabled: true
  model: ""
  temperature: 0.1
  max_retries: 3
  max_steps: 16
mcp:
  enabled: true
  mode: simplified
  verbose_logging: false

# Language-independent, read-only Git investigation. No repository code execution.
git_audit:
  enabled: true
  history_depth: 200
  max_pack_mib: 256
  max_tool_calls: 80

# Generate an evidence-linked sequence diagram after validated findings (extra model calls).
generate_sequence_diagrams: true

# Live queue/start limits. Rolling 24-hour starts include retries, not token cost.
# System tasks share global/project buckets; individual user buckets apply to user IDs > 0.
audit_quotas:
  outstanding_global: 200
  outstanding_project: 50
  outstanding_user: 20
  running_project: 2
  running_user: 2
  daily_global: 1000
  daily_project: 200
  daily_user: 100

# 在独立上下文中重新读取来源并检查反证；不执行仓库代码
verify_findings: true

# Shared across primary audit, groups, verification and diagrams.
# 0 disables; provider usage is known after each request (one request may exceed).
model_budget:
  max_tokens: 0
  # Empty currency disables estimates. Set your provider-specific prices.
  currency: ""
  input_price_per_million: 0
  output_price_per_million: 0
  verification_pricing_configured: false
  verification_input_price_per_million: 0
  verification_output_price_per_million: 0
# Same configured API and credentials; empty inherits the primary model.
verification_model: ""
